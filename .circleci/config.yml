version: 2.1

commands:
  notify-job-failure:
    parameters:
      source:
        type: string
    steps:
      - run:
          name: Notify Telegram about << parameters.source >> failure
          when: on_fail
          command: |
            marker="/tmp/cloudcheckin-telegram-notified"
            if [ -f "$marker" ]; then
              echo "A platform notification was already sent; skipping fallback"
              exit 0
            fi

            telegram_token=$(printf '%s' "$TELEGRAM_TOKEN" | tr -d '\r\n')
            telegram_chat_id=$(printf '%s' "$TELEGRAM_CHAT_ID" | tr -d '\r\n')
            if [ -z "$telegram_token" ] || [ -z "$telegram_chat_id" ]; then
              echo "Telegram configuration is incomplete; cannot send failure fallback"
              exit 0
            fi

            timestamp=$(TZ=Asia/Shanghai date '+%Y/%m/%d %H:%M:%S')
            message="${timestamp}
            << parameters.source >>
            CircleCI job failed before a platform notification was sent.
            ${CIRCLE_BUILD_URL}"

            curl --fail --silent --show-error \
              --request POST \
              --data-urlencode "chat_id=${telegram_chat_id}" \
              --data-urlencode "text=${message}" \
              "https://api.telegram.org/bot${telegram_token}/sendMessage"

jobs:
  nodeseek:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install curl_cffi python-dotenv
      - run:
          name: Run Nodeseek signin
          command: |
            python -m nodeseek.nodeseek
      - notify-job-failure:
          source: NODESEEK

  v2ex:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install curl_cffi python-dotenv
      - run:
          name: Run V2EX signin
          command: |
            python -m v2ex.v2ex
      - notify-job-failure:
          source: V2EX

  onepoint3acres:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install requests 2captcha-python python-dotenv
      - run:
          name: Run 1point3acres signin
          command: |
            python -m onepoint3acres.onepoint3acres
      - notify-job-failure:
          source: 1POINT3ACRES

  deepflood:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install curl_cffi python-dotenv
      - run:
          name: Run Deepflood signin
          command: |
            python -m deepflood.deepflood
      - notify-job-failure:
          source: DEEPFLOOD

  sakurafrp:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install python-dotenv 'httpx[http2]' cryptography openai
      - run:
          name: Run SakuraFrp signin
          command: |
            python -m sakurafrp.sakurafrp
      - notify-job-failure:
          source: SAKURAFRP

workflows:
  # Allow manual triggers
  manual_trigger:
    jobs:
      - nodeseek:
          context: checkincontext
      - v2ex:
          context: checkincontext
      - onepoint3acres:
          context: checkincontext
      - deepflood:
          context: checkincontext
      - sakurafrp:
          context: checkincontext
